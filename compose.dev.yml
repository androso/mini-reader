services:
    postgres:
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: reader_dev
        ports:
            - "5432:5432"
        volumes:
            - reader_dev_postgres:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d reader_dev"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    reader_dev_postgres:
