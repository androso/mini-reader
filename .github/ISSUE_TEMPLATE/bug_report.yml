name: Bug report
description: Report a reproducible problem in Reader Platform
title: "[Bug]: "
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: Do not include credentials, private books, user data, or security vulnerabilities. Follow SECURITY.md for security reports.
    - type: textarea
      id: description
      attributes:
          label: What happened?
          description: Describe the observed behavior and what you expected instead.
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: Reproduction
          description: Provide the smallest reproducible sequence using synthetic data.
      validations:
          required: true
    - type: input
      id: commit
      attributes:
          label: Commit or version
          placeholder: Git commit SHA or release tag
      validations:
          required: true
    - type: textarea
      id: environment
      attributes:
          label: Environment
          description: Include OS, Node.js, pnpm, browser, and deployment method where relevant.
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Redacted logs
          render: shell
